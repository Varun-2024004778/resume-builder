<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="stylesheet" href="css/common.css">

    <title>Professional Summary | Dream CV</title>

</head>


<body>


    <!-- =========================
         HEADER
         ========================= -->

    <header class="top-header">

        <div class="logo">
            Dream <span>CV</span>
        </div>

        <button
            type="button"
            class="logout-btn"
            id="logoutBtn"
        >
            Logout
        </button>

    </header>



    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main class="page-container">


        <h1 class="page-title">
            Professional Summary
        </h1>


        <p class="page-description">
            Write a short description about yourself,
            your skills, experience, and career goals.
        </p>



        <!-- =========================
             SUMMARY CARD
             ========================= -->

        <section class="content-card">


            <h2>
                Step 5 of 5
            </h2>


            <p>
                <strong>
                    Edit your summary
                </strong>
                <br>

                Write a brief description about yourself,
                your skills, experience, and career goals.
            </p>



            <!-- =========================
                 SUMMARY FORM
                 ========================= -->

            <form id="summaryForm">


                <div class="form-group">

                    <label for="summary">
                        Professional Summary
                    </label>

                    <textarea
                        id="summary"
                        rows="10"
                        placeholder="Write a brief professional summary about yourself..."
                        required
                    ></textarea>

                </div>



                <!-- =========================
                     FORM BUTTONS
                     ========================= -->

                <div class="right-buttons">

                    <button
                        type="submit"
                        id="generateBtn"
                        class="primary-btn"
                    >
                        Generate CV
                    </button>


                    <button
                        type="reset"
                        id="resetBtn"
                        class="primary-btn"
                    >
                        Reset
                    </button>

                </div>


            </form>


        </section>


    </main>



    <!-- =========================
         PREVIOUS BUTTON
         ========================= -->

    <nav class="page-navigation">


        <a href="projects.html">

            <button
                type="button"
                class="primary-btn"
            >
                ← Previous
            </button>

        </a>


    </nav>



    <!-- =========================
         FOOTER
         ========================= -->

    <footer class="main-footer">

        <p>
            © 2026 Dream CV Maker. All Rights Reserved.
        </p>

    </footer>



    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script src="js/summary.js"></script>


</body>

</html>
