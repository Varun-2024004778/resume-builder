<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="stylesheet" href="css/common.css">

    <title>Skills | Dream CV</title>

</head>


<body>


    <!-- =========================
         HEADER
         ========================= -->

    <header class="top-header">

        <div class="logo">
            Dream <span>CV</span>
        </div>

        <button
            type="button"
            class="logout-btn"
            id="logoutBtn"
        >
            Logout
        </button>

    </header>



    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main class="page-container">


        <h1 class="page-title">
            Skills
        </h1>


        <p class="page-description">
            Select the skills that best represent your abilities.
        </p>



        <!-- =========================
             SKILLS CARD
             ========================= -->

        <section class="content-card">


            <h2>
                Step 3 of 5
            </h2>


            <p>
                <strong>
                    Edit your top skills
                </strong>
                <br>

                Select your skills from the list below
                using the checkboxes.
            </p>



            <!-- =========================
                 SKILLS FORM
                 ========================= -->

            <form id="skillsForm">


                <div class="skills-options">


                    <label class="skill-option">
                        <input
                            type="checkbox"
                            value="HTML"
                        >
                        HTML
                    </label>


                    <label class="skill-option">
                        <input
                            type="checkbox"
                            value="CSS"
                        >
                        CSS
                    </label>


                    <label class="skill-option">
                        <input
                            type="checkbox"
                            value="Python"
                        >
                        Python
                    </label>


                    <label class="skill-option">
                        <input
                            type="checkbox"
                            value="JavaScript"
                        >
                        JavaScript
                    </label>


                    <label class="skill-option">
                        <input
                            type="checkbox"
                            value="Software development"
                        >
                        Software Development
                    </label>


                    <label class="skill-option">
                        <input
                            type="checkbox"
                            value="Database management"
                        >
                        Database Management
                    </label>


                    <label class="skill-option">
                        <input
                            type="checkbox"
                            value="Web development"
                        >
                        Web Development
                    </label>


                    <label class="skill-option">
                        <input
                            type="checkbox"
                            value="Java programming"
                        >
                        Java Programming
                    </label>


                    <label class="skill-option">
                        <input
                            type="checkbox"
                            value="Testing and debugging"
                        >
                        Testing and Debugging
                    </label>


                    <label class="skill-option">
                        <input
                            type="checkbox"
                            value="Web security"
                        >
                        Web Security
                    </label>


                    <label class="skill-option">
                        <input
                            type="checkbox"
                            value="Mobile app development"
                        >
                        Mobile App Development
                    </label>


                    <label class="skill-option">
                        <input
                            type="checkbox"
                            value="API design"
                        >
                        API Design
                    </label>


                </div>



                <!-- =========================
                     OTHER SKILLS
                     ========================= -->

                <div class="form-group other-skills">

                    <label for="skills">
                        Any other skills
                    </label>

                    <textarea
                        id="skills"
                        rows="6"
                        placeholder="Enter any other skills..."
                    ></textarea>

                </div>


            </form>


        </section>


    </main>



    <!-- =========================
         PREVIOUS / NEXT
         ========================= -->

    <nav class="page-navigation">


        <a href="education.html">

            <button
                type="button"
                class="primary-btn"
            >
                ← Previous
            </button>

        </a>



        <button
            type="button"
            class="primary-btn"
            id="nextBtn"
        >
            Next →
        </button>


    </nav>



    <!-- =========================
         FOOTER
         ========================= -->

    <footer class="main-footer">

        <p>
            © 2026 Dream CV Maker. All Rights Reserved.
        </p>

    </footer>



    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script src="js/skills.js"></script>


</body>

</html>
