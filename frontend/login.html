<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://127.0.0.1:5000 http://localhost:5000 https:; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="css/style1.css">
</head>
<body>

<div class="container">

    <div class="form-box">

        <h2>Welcome Back</h2>

        <form id="loginForm">

            <div class="input-group">
                <label>Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    autocomplete="current-password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit">
                Login
            </button>

            <p>
                <a href="forgot-password.html">Forgot password?</a>
            </p>

            <p>
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

        </form>

    </div>

</div>

<script src="js/config.js"></script>
<script src="js/script.js"></script>

</body>
</html>
