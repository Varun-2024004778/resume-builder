<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="stylesheet" href="css/common.css">

    <title>Saved CVs | Dream CV</title>

</head>

<body>


    <!-- HEADER -->

    <header class="top-header">

        <div class="logo">
            Dream <span>CV</span>
        </div>

        <button
            type="button"
            class="logout-btn"
            id="logoutBtn"
        >
            Logout
        </button>

    </header>


    <!-- MAIN -->

    <main class="page-container">

        <h1 class="page-title">
            My Saved CVs
        </h1>

        <p class="page-description">
            View and manage your saved resumes.
        </p>


        <section class="content-card">

            <div id="savedCVContainer">

                <p>
                    Loading your saved CV...
                </p>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="main-footer">

        <p>
            © 2026 Dream CV Maker. All Rights Reserved.
        </p>

    </footer>


    <script src="js/saved-cv.js"></script>

</body>

</html>
