<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/common.css">

    <title>Contact Information | Dream CV</title>
</head>

<body>

    <!-- =========================
         HEADER
         ========================= -->

    <header class="top-header">

        <div class="logo">
            Dream <span>CV</span>
        </div>

        <button type="button" class="logout-btn" id="logoutBtn">
            Logout
        </button>

    </header>


    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main class="page-container">

        <h1 class="page-title">
            Contact Information
        </h1>

        <p class="page-description">
            Tell us about yourself and how people can reach you.
        </p>


        <!-- =========================
             CONTACT FORM CARD
             ========================= -->

        <section class="content-card">

            <h2>Step 1 of 5</h2>

            <p>
                <strong>Edit the basics</strong><br>

                Include your full name and contact details
                so that people can reach you.
            </p>


            <form id="contactForm">

                <!-- First Name -->

                <div class="form-group">

                    <label for="firstname">
                        First name
                    </label>

                    <input
                        type="text"
                        id="firstname"
                        placeholder="Enter your first name"
                    >

                </div>


                <!-- Last Name -->

                <div class="form-group">

                    <label for="lastname">
                        Last name
                    </label>

                    <input
                        type="text"
                        id="lastname"
                        placeholder="Enter your last name"
                    >

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                </div>


                <!-- Address -->

                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        rows="3"
                        placeholder="like 123 town,district,city,state,country, pincode"
                    ></textarea>

                </div>

            </form>

        </section>

    </main>


    <!-- =========================
         PREVIOUS / NEXT
         ========================= -->

    <nav class="page-navigation">

        <a href="intro.html">
            <button type="button" class="primary-btn">
                ← Previous
            </button>
        </a>


        <button
            type="button"
            class="primary-btn"
            id="nextBtn"
        >
            Next →
        </button>

    </nav>


    <!-- =========================
         FOOTER
         ========================= -->

    <footer class="main-footer">

        <p>
            © 2026 Dream CV Maker. All Rights Reserved.
        </p>

    </footer>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script src="js/contact.js"></script>

</body>

</html>
