<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="stylesheet" href="css/common.css">

    <title>Education | Dream CV</title>

</head>


<body>


    <!-- =========================
         HEADER
         ========================= -->

    <header class="top-header">

        <div class="logo">
            Dream <span>CV</span>
        </div>

        <button
            type="button"
            class="logout-btn"
            id="logoutBtn"
        >
            Logout
        </button>

    </header>



    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main class="page-container">


        <h1 class="page-title">
            Education Information
        </h1>


        <p class="page-description">
            Tell us about your education, training and
            academic background.
        </p>



        <!-- =========================
             EDUCATION CARD
             ========================= -->

        <section class="content-card">


            <h2>
                Step 2 of 5
            </h2>


            <p>
                <strong>
                    Tell us about your education
                </strong>
                <br>

                Include any education, training, or programs
                even if unfinished, to highlight your progress
                and goals.
            </p>



            <!-- =========================
                 EDUCATION FORM
                 ========================= -->

            <form id="educationForm">


                <!-- Institution -->

                <div class="form-group">

                    <label for="name">
                        Institution Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Institution name"
                    >

                </div>



                <!-- Location -->

                <div class="form-group">

                    <label for="location">
                        School Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Institution location"
                    >

                </div>



                <!-- Degree -->

                <div class="form-group">

                    <label for="degree">
                        Degree
                    </label>

                    <input
                        type="text"
                        id="degree"
                        placeholder="Stream of education"
                    >

                </div>



                <!-- Graduation Date -->

                <div class="form-group">

                    <label for="date">
                        Graduation Date
                    </label>

                    <input
                        type="date"
                        id="date"
                    >

                </div>



                <!-- Currently Enrolled -->

                <div class="form-group">

                    <input
                        type="checkbox"
                        id="enrolled"
                    >

                    <label for="enrolled">
                        I'm still enrolled
                    </label>

                </div>


            </form>

        </section>

    </main>



    <!-- =========================
         PREVIOUS / NEXT
         ========================= -->

    <nav class="page-navigation">


        <a href="contact.html">

            <button
                type="button"
                class="primary-btn"
            >
                ← Previous
            </button>

        </a>



        <button
            type="button"
            class="primary-btn"
            id="nextBtn"
        >
            Next →
        </button>


    </nav>



    <!-- =========================
         FOOTER
         ========================= -->

    <footer class="main-footer">

        <p>
            © 2026 Dream CV Maker. All Rights Reserved.
        </p>

    </footer>



    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script src="js/education.js"></script>


</body>

</html>
