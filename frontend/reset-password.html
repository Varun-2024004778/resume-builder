<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://127.0.0.1:5000 http://localhost:5000 https:; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="css/style1.css">
</head>
<body>
<div class="container">
    <div class="form-box">
        <h2>Reset Password</h2>
        <form id="resetPasswordForm">
            <div class="input-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password" minlength="10" maxlength="72" autocomplete="new-password" required>
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password" minlength="10" maxlength="72" autocomplete="new-password" required>
            </div>
            <button type="submit">Reset Password</button>
            <p><a href="login.html">Back to Login</a></p>
        </form>
    </div>
</div>
<script src="js/config.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
