<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="css/preview.css"
    >

    <title>CV Preview</title>

</head>


<body>

    <div class="preview-container">

        <!-- CV Header -->

        <header class="cv-header">

            <h1 id="fullName">
                Your Name
            </h1>

            <p id="contactDetails">
                Phone | Email | Location
            </p>

        </header>


        <!-- Professional Summary -->

        <section class="cv-section">

            <h2>
                Professional Summary
            </h2>

            <p id="summary">
                Your professional summary will appear here.
            </p>

        </section>


        <!-- Education -->

        <section class="cv-section">

            <h2>
                Education
            </h2>

            <div id="educationContainer">

                <!-- Education will be added by JavaScript -->

            </div>

        </section>


        <!-- Skills -->

        <section class="cv-section">

            <h2>
                Skills
            </h2>

            <div id="skillsContainer">

                <!-- Skills will be added by JavaScript -->

            </div>

        </section>


        <!-- Projects -->

        <section class="cv-section">

            <h2>
                Projects
            </h2>

            <div id="projectsContainer">

                <!-- Projects will be added by JavaScript -->

            </div>

        </section>


        <!-- Buttons -->

        <div class="preview-buttons">

            <button
                type="button"
                id="editBtn"
            >
                Edit CV
            </button>

            <button
                type="button"
                id="printBtn"
            >
                Print / Save PDF
            </button>

        </div>

    </div>


    <script src="js/preview.js"></script>

</body>

</html>
