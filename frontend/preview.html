<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://127.0.0.1:5000 http://localhost:5000 https:; object-src 'none'; base-uri 'self'; form-action 'self'">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="css/preview.css"
    >

    <title>CV Preview</title>

</head>


<body>

    <div class="preview-container">

        <!-- CV Header -->

        <header class="cv-header">
            <div class="cv-initials" id="initials">JS</div>

            <h1 id="fullName">
                Your Name
            </h1>

            <p id="contactDetails">
                Phone | Email | Location
            </p>

        </header>


        <!-- Professional Summary -->

        <section class="cv-section">

            <h2>
                Professional Summary
            </h2>

            <p id="summary">
                Your professional summary will appear here.
            </p>

        </section>


        <!-- Skills -->

        <section class="cv-section">

            <h2>Skills</h2>

            <div id="skillsContainer">
            </div>

        </section>


        <!-- Experience -->

        <section class="cv-section">

            <h2>Experience</h2>

            <div id="experienceContainer">
            </div>

        </section>


        <!-- Education -->

        <section class="cv-section">

            <h2>
                Education and Training
            </h2>

            <div id="educationContainer">

                <!-- Education will be added by JavaScript -->

            </div>

        </section>


        <!-- Projects -->

        <section class="cv-section">

            <h2>
                Projects
            </h2>

            <div id="projectsContainer">

                <!-- Projects will be added by JavaScript -->

            </div>

        </section>


        <!-- Certifications -->

        <section class="cv-section">

            <h2>Certifications</h2>

            <div id="certificationsContainer">

                <!-- Certifications will be added by JavaScript -->

            </div>

        </section>


        <!-- Buttons -->

        <div class="preview-buttons">

            <button
                type="button"
                id="editBtn"
            >
                Edit CV
            </button>

            <button
                type="button"
                id="printBtn"
            >
                Print / Save PDF
            </button>

        </div>

    </div>


    <script src="js/config.js"></script>
    <script src="js/preview.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/save.js"></script>

</body>

</html>
